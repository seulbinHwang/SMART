# Validation config for SMART backbone + sparse flow matching agent head

time_info: &time_info
  num_historical_steps: 11
  num_future_steps: 80
  token_size: 2048

Dataset:
  root:
  batch_size: 1
  shuffle: False
  num_workers: 1
  pin_memory: True
  persistent_workers: True
  train_raw_dir:
  val_raw_dir: ["data/valid_demo"]
  test_raw_dir:
  TargetBuilder: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: "scalable"
  <<: *time_info

Trainer:
  strategy: ddp_find_unused_parameters_false
  accelerator: "gpu"
  devices: 1
  max_epochs: 32
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32
  accumulate_grad_batches: 1

Model:
  mode: "validation"
  predictor: "smart"
  dataset: "waymo"
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  <<: *time_info
  head_dim: 16
  dropout: 0.1
  num_freq_bands: 64
  lr: 0.0005
  warmup_steps: 0
  total_steps: 32
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    time_span: 30
    future_window_steps: 20
    anchor_chunk_k: 13
    ode_steps: 4
    overlap_loss_weight: 0.1
    closed_loop_eval: True
  visualization:
    enabled: False
    output_dir: "rollout_vis"
    scenario_index_in_batch: 0
    max_scenarios: 1
    save_gap_sec: 0.1
    raw_step_sec: 0.1
    trajectory_mode: "line"
    figsize: [12.0, 12.0]
    dpi: 180
    margin_m: 20.0
    video_fps:
    draw_agent_ids: False